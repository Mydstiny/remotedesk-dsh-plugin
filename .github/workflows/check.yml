name: source-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  native-dsh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - name: Install pinned DSH runtime
        env:
          DSH_RUNTIME_ROOT: ${{ runner.temp }}/remotedesk-dsh-runtime
        run: node -e "const {spawnSync}=require('node:child_process'); const npm=process.platform==='win32'?'npm.cmd':'npm'; const r=spawnSync(npm,['install','--prefix',process.env.DSH_RUNTIME_ROOT,'--no-audit','--no-fund','@deepseek-ai/dsh@0.1.2-rc.1','@deepseek-ai/cordis@4.0.2','pnpm@11.21.0'],{stdio:'inherit'}); process.exit(r.status ?? 1)"
      - name: Add pinned DSH runtime to PATH
        env:
          DSH_RUNTIME_ROOT: ${{ runner.temp }}/remotedesk-dsh-runtime
        run: node -e "const fs=require('node:fs'); const path=require('node:path'); const os=require('node:os'); const root=process.env.DSH_RUNTIME_ROOT; const dirs=process.platform==='win32'?[root,path.join(root,'bin')]:[path.join(root,'bin'),root]; fs.appendFileSync(process.env.GITHUB_PATH,dirs.join(os.EOL)+os.EOL)"
      - run: node bin/remotedesk-dsh.mjs doctor --json
      - run: node test/native-flow-runtime.mjs
      - run: node test/native-shutdown-runtime.mjs
      - run: npm pack --ignore-scripts
      - run: node test/install-runtime.mjs
