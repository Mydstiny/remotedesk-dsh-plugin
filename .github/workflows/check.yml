name: source-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.16.0", "24.18.0", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  native-dsh:
    name: native-dsh (${{ matrix.os }}, ${{ matrix.target.profile }}, ${{ matrix.target.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        target:
          - { profile: legacy-012, node: "22.16.0" }
          - { profile: legacy-012, node: "24.18.0" }
          - { profile: modern-021, node: "22.18.0" }
          - { profile: modern-021, node: "24.18.0" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.target.node }}
      - run: npm ci --ignore-scripts
      - name: Install pinned DSH runtime
        env:
          DSH_RUNTIME_ROOT: ${{ runner.temp }}/remotedesk-dsh-runtime
        run: node bin/provision-dsh-runtime.mjs --destination "${{ runner.temp }}/remotedesk-dsh-runtime" --profile ${{ matrix.target.profile }}
      - name: Add pinned DSH runtime to PATH
        env:
          DSH_RUNTIME_ROOT: ${{ runner.temp }}/remotedesk-dsh-runtime
        run: node -e "const fs=require('node:fs'); const path=require('node:path'); const os=require('node:os'); const root=process.env.DSH_RUNTIME_ROOT; const bin=path.join(root,'node_modules','.bin'); const runtime=path.join(root,'node_modules','@deepseek-ai','dsh'); fs.appendFileSync(process.env.GITHUB_PATH,bin+os.EOL); fs.appendFileSync(process.env.GITHUB_ENV,'REMOTEDESK_DSH_RUNTIME_ROOT='+runtime+os.EOL)"
      - run: node bin/remotedesk-dsh.mjs doctor --json
      - run: node test/native-flow-runtime.mjs
      - run: node test/native-shutdown-runtime.mjs
      - run: npm pack --ignore-scripts
      - run: node test/install-runtime.mjs
      - run: node test/profile-runtime.mjs
