name: source-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  native-dsh:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --global @deepseek-ai/dsh@0.1.2-rc.1
      - run: node bin/remotedesk-dsh.mjs doctor --json
      - run: node test/agent-loop-runtime.mjs
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --global @deepseek-ai/dsh@0.1.2-rc.1
      - name: Build the pinned project image
        shell: bash
        run: |
          docker build -t remotedesk-test sandbox
          printf 'REMOTEDESK_TEST_IMAGE=%s\n' "$(docker image inspect remotedesk-test --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: node test/docker-runtime.mjs
      - run: node test/bridge-runtime.mjs
      - run: node test/profile-runtime.mjs
